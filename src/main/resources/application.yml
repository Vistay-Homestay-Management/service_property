spring:
  application:
    name: vistay-property-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:vistay_property_db}
    username: ${DB_USERNAME:vistay}
    password: ${DB_PASSWORD:vistay}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:4}
      minimum-idle: ${DB_POOL_MIN_IDLE:0}
      schema: app
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: app
  flyway:
    enabled: true
    default-schema: app
    schemas: app
    create-schemas: true
    clean-disabled: true
    baseline-on-migrate: false
    out-of-order: false
    validate-on-migrate: true
  graphql:
    http:
      path: /graphql
    graphiql:
      enabled: false
  grpc:
    server:
      port: ${GRPC_SERVER_PORT:9090}
      ssl:
        enabled: ${GRPC_TLS_ENABLED:true}
        bundle: ${GRPC_SSL_BUNDLE:grpc-property-server}
        client-auth: require
  ssl:
    bundle:
      pem:
        grpc-property-server:
          keystore:
            certificate: ${PROPERTY_GRPC_SERVER_CERT:file:/run/secrets/grpc/server.crt}
            private-key: ${PROPERTY_GRPC_SERVER_KEY:file:/run/secrets/grpc/server.key}
          truststore:
            certificate: ${PROPERTY_GRPC_CLIENT_CA_CERT:file:/run/secrets/grpc/ca.crt}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9093}
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:SSL}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:SCRAM-SHA-512}
      sasl.jaas.config: ${KAFKA_SASL_JAAS_CONFIG:}
      ssl.truststore.location: ${KAFKA_TRUSTSTORE_LOCATION:}
      ssl.truststore.password: ${KAFKA_TRUSTSTORE_PASSWORD:}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      enable-auto-commit: false
      properties:
        isolation.level: read_committed

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

vistay:
  grpc:
    allowed-caller-uris: ${GRPC_ALLOWED_CALLER_URIS:spiffe://vistay/service/booking}
    maximum-deadline: ${GRPC_MAXIMUM_DEADLINE:2s}

logging:
  structured:
    format:
      console: logstash
